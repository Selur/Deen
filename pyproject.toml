[build-system]
build-backend = 'mesonpy'
requires = ['meson-python>=0.15']

[project]
name = 'vapoursynth-deen'
dynamic = ['version']
description = 'Deen: clean-room reimplementation of the Deen 1.0 beta 1 denoiser (c2d, c3d, a2d, a3d, w2d, w3d) for VapourSynth and AviSynth+'
readme = 'README.md'
license = {text = 'MIT'}
requires-python = '>=3.8'
dependencies = ['VapourSynth']

[tool.meson-python.args]
setup = ['-Dpython_package=true']

[tool.meson-python.wheel]
exclude = ['*/*.dll.a', '*/*.lib', '*/*.a']
